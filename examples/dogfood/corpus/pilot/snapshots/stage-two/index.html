<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Note</title>
</head>
<body>
  <h1>Note</h1>
  <textarea id="note" rows="10" cols="60" placeholder="Write your note here..."></textarea>
  <br>
  <button id="clear" type="button">Clear</button>

  <script>
    const note = document.getElementById("note");
    const clear = document.getElementById("clear");
    const STORAGE_KEY = "note.text";

    function loadNote() {
      try {
        return localStorage.getItem(STORAGE_KEY) ?? "";
      } catch {
        return "";
      }
    }

    function saveNote(value) {
      try {
        localStorage.setItem(STORAGE_KEY, value);
      } catch {
        // Storage unavailable: editing still works, persistence is skipped.
      }
    }

    // Restore the saved note (including an empty one) on load.
    note.value = loadNote();

    // Persist on every change, including when the field is emptied.
    note.addEventListener("input", () => saveNote(note.value));

    clear.addEventListener("click", () => {
      note.value = "";
      saveNote("");
      note.focus();
    });
  </script>
</body>
</html>

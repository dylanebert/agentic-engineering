name: consumer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: consumer-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun run typecheck
      - name: Install software Vulkan device
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: bun run test
        env:
          SHALLOT_ALLOW_SOFTWARE_GPU: "1"

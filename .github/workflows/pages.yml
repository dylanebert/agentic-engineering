# GitHub Pages: builds the site at base `/agentic-engineering/` and deploys it. Runs on push to main.
name: pages

on:
    push:
        branches: [main]

permissions:
    contents: read
    pages: write
    id-token: write

# One in-flight deploy at a time; don't cancel a running deploy (Pages dislikes half-writes).
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - name: Build
              run: bun run build
            # Fail closed: a served page still carrying the placeholder would report a literal
            # `__SITE_RUM_VERSION__` as its version and match no uploaded map.
            - name: Check the RUM build version was filled
              run: |
                  if grep -q "__SITE_RUM_VERSION__" dist/index.html; then
                    echo "RUM version placeholder survived the build in dist/index.html" >&2
                    exit 1
                  fi
            # Datadog RUM reports minified stacks. Error Tracking un-minifies one only when a map was
            # uploaded under the same service and version the page reported, so `github.sha` is both the
            # `--release-version` here and the `version` the build wrote into `DD_RUM.init`.
            - name: Upload source maps to Datadog
              run: bunx @datadog/datadog-ci@5.23.0 sourcemaps upload dist --service agentic-engineering --release-version ${{ github.sha }} --minified-path-prefix https://dylanebert.com/agentic-engineering/
              env:
                  DD_API_KEY: ${{ secrets.DD_API_KEY }}
            # `build.sourcemap: "hidden"` leaves no `//# sourceMappingURL` pointing at these, but publishing
            # them anyway would put the unminified source on dylanebert.com. Datadog has them; drop them.
            - name: Drop source maps from the published site
              run: find dist -name '*.map' -delete
            - uses: actions/configure-pages@v6
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist
            - id: deploy
              uses: actions/deploy-pages@v5
